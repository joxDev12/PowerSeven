schema_version: 2
source_graph: ../../graph/powerseven.graph.json
scope:
  source_current: azure_reference_only
  target_local: vmware_rebuild
  persistent_application_data: out_of_scope

service_control:
  declaration: ../service-control/profiles.yml
  boot_profile: ALL-OFF-OPTIONAL
  core_profile: CORE
  optional_profiles: [NEXTCLOUD, FORGEJO, STIRLING, PTERODACTYL, WAZUH, SCRIBBLE]
  core_components: [WIREGUARD, SSH, NGINX, DASHBOARD, ADGUARD, COCKPIT_SOCKET]
  temporary_core_components: [POSTGRESQL]
  postgresql_core_reason: dashboard_current_dependency
  dashboard_current_database: azienda_lab
  dashboard_future_identity_source: AD_LDAP_primary_not_implemented
  docker_current_decision: CORE_for_current_AdGuard_container
  docker_future_decision: on_demand_if_AdGuard_native_and_no_other_CORE_consumer
  controller_installation: target_local_only; not_applied_to_azure

provisioning_order:
  - order: 0
    phase: host_vmware_preparation
    parallel: false
    provides: [vmware_vmnet8_nat]
    requires: []
  - order: 1
    phase: vm_creation
    parallel: true
    provides: [vm_vps12, vm_vps13, vm_vps14]
    requires: [vmware_vmnet8_nat]
  - order: 2
    phase: os_bootstrap
    parallel: true
    provides: [os_vps12, os_vps13, os_vps14]
    requires: [vm_vps12, vm_vps13, vm_vps14]
    dns: 192.168.214.2
  - order: 3
    phase: local_underlay_and_bootstrap_dns
    parallel: true
    provides: [underlay_vps12, underlay_vps13, underlay_vps14, bootstrap_dns]
    requires: [os_vps12, os_vps13, os_vps14]
  - order: 4
    phase: dc02_ad_dns_bootstrap
    parallel: false
    provides: [id_ad_ds, id_dns_dc02, id_kerberos, id_ldap, id_global_catalog]
    requires: [underlay_vps13, bootstrap_dns]
    forwarder: 192.168.214.2
  - order: 5
    phase: vps14_base_and_adguard
    parallel: false
    provides: [svc_ssh_vps14, svc_docker, app_adguard]
    requires: [underlay_vps14, bootstrap_dns]
  - order: 6
    phase: finalize_dns_forwarding
    parallel: false
    provides: [dns_forwarder_final]
    requires: [id_dns_dc02, app_adguard]
    action: set_dc02_forwarder_to_192.168.214.14
  - order: 7
    phase: wireguard_hub_and_peers
    parallel: false
    provides: [svc_wireguard_hub, svc_wireguard_vps12, svc_wireguard_vps13, net_wireguard]
    requires: [underlay_vps12, underlay_vps13, underlay_vps14]
  - order: 8
    phase: certificates_and_empty_databases
    parallel: true
    provides: [cert_soc_lab_ca, id_ldaps, db_postgresql, db_mariadb, db_redis]
    requires: [id_ad_ds, app_adguard, svc_docker]
    data_policy: create_empty_datastores_only
    service_control_note: PostgreSQL is temporary CORE while azienda-portal uses azienda_lab
  - order: 9
    phase: application_deployment
    parallel: true
    provides: [application_deployment, app_nextcloud, app_forgejo, app_stirling, app_portal, app_scribble]
    requires: [svc_docker, db_postgresql, db_redis, id_ldap, cert_soc_lab_ca]
    data_policy: fresh_install_no_application_data_restore
  - order: 10
    phase: pterodactyl_panel
    parallel: false
    provides: [app_pterodactyl]
    requires: [db_mariadb]
    dependency_kind: panel_before_workers
  - order: 11
    phase: pterodactyl_wings_configuration
    parallel: false
    provides: [wings_configuration]
    requires: [app_pterodactyl, db_mariadb]
    dependency_kind: configuration_after_panel
  - order: 12
    phase: pterodactyl_runtime_workers
    parallel: false
    provides: [svc_wings]
    requires: [wings_configuration, app_pterodactyl, svc_docker]
    dependency_kind: wings_runtime_after_configuration_and_docker
  - order: 13
    phase: pterodactyl_queue_worker
    parallel: false
    provides: [svc_pteroq]
    requires: [svc_wings, app_pterodactyl, db_mariadb]
    dependency_kind: pteroq_after_wings
  - order: 14
    phase: nginx_and_firewall
    parallel: false
    provides: [svc_nginx, cfg_windows_firewall]
    requires: [cert_soc_lab_ca, application_deployment]
  - order: 15
    phase: wazuh_fresh_install
    parallel: false
    provides: [mon_manager, mon_indexer, mon_dashboard]
    requires: [svc_wireguard_hub]
    data_policy: fresh_index_empty_history
  - order: 16
    phase: vps12_domain_join_and_desktop
    parallel: false
    provides: [svc_wireguard_vps12, svc_sssd, svc_xfce, svc_xrdp]
    requires: [os_vps12, svc_wireguard_hub, id_ad_ds, id_dns_dc02, id_kerberos, id_ldap]
  - order: 17
    phase: monitoring_agents
    parallel: true
    provides: [mon_agent_vps12, mon_agent_dc02]
    requires: [mon_manager, svc_wireguard_vps12, id_ad_ds]
  - order: 18
    phase: end_to_end_validation
    parallel: false
    provides: [local_acceptance_report]
    requires: [net_wireguard, id_dns_dc02, svc_nginx, app_nextcloud, app_forgejo, app_pterodactyl, mon_manager, svc_xrdp]

dependency_classes:
  provisioning:
    - source: svc_wings
      relation: PROVISIONED_AFTER
      target: app_pterodactyl
    - source: svc_pteroq
      relation: PROVISIONED_AFTER
      target: svc_wings
  configuration:
    - source: svc_wings
      relation: REQUIRES
      target: app_pterodactyl
    - source: svc_pteroq
      relation: REQUIRES
      target: app_pterodactyl
  runtime:
    - source: svc_wings
      relation: CONNECTS_TO
      target: app_pterodactyl
    - source: svc_pteroq
      relation: CONNECTS_TO
      target: app_pterodactyl
  dns_bootstrap:
    - source: id_dns_dc02
      phase: initial
      forwarder: 192.168.214.2
    - source: id_dns_dc02
      phase: final
      forwarder: app_adguard

execution_models:
  host_services:
    - mon_manager
    - mon_indexer
    - mon_dashboard
    - app_portal
  container_services:
    - app_nextcloud
    - app_forgejo
    - app_stirling
    - app_scribble
  pterodactyl:
    - db_mariadb
    - app_pterodactyl
    - wings_configuration
    - svc_wings
    - svc_pteroq
  cross_host:
    - consumer: app_nextcloud
      provider: id_ldap
      provider_host: vps13
      consumer_host: vps14
    - consumer: app_forgejo
      provider: id_ldap
      provider_host: vps13
      consumer_host: vps14

secret_policy:
  forbidden_values: [password, token, private_key, api_key, certificate_key]
  allowed_values: [REQUIRED_SECRET, logical_secret_reference]
