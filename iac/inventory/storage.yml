schema_version: 2
source_graph: ../../graph/powerseven.graph.json
scope:
  target: fresh_local_installation
  backups: out_of_scope
  application_data_migration: out_of_scope
  snapshots: out_of_scope

recreatable_infrastructure:
  - graph_id: cfg_wg
    host: vps14
    kind: service_configuration
    data: [WireGuard interface, peer definitions, AllowedIPs]
    target: generate_from_inventory
    secret_refs: [wireguard_server_private_key, wireguard_peer_config]
    persistent: true
    recreatable: true
  - graph_id: cfg_nginx
    host: vps14
    kind: service_configuration
    data: [virtual_hosts, upstreams, TLS bindings]
    target: generate_from_inventory
    secret_refs: [certificate_private_keys]
    persistent: true
    recreatable: true
  - graph_id: cfg_ad_dns
    host: vps13
    kind: identity_configuration
    data: [new_forest, DNS zones, records, forwarder, groups]
    target: provision_from_declaration
    secret_refs: [domain_safe_mode_password, domain_admin_password]
    persistent: true
    recreatable: true
  - graph_id: cfg_lab_certificates
    host: vps14
    kind: lab_certificate_authority
    data: [new_lab_CA, server_certificates, LDAPS_certificate]
    target: generate_for_new_lab
    secret_refs: [certificate_private_keys]
    persistent: true
    recreatable: true
  - graph_id: datastore_postgresql
    host: vps14
    kind: empty_database
    source: db_postgresql
    data: [database schemas, roles, grants]
    target: create_empty_databases
    databases: [azienda_lab, forgejo, nextcloud, postgres]
    persistent: true
    recreatable: true
  - graph_id: datastore_mariadb
    host: vps14
    kind: empty_database
    source: db_mariadb
    data: [database schema, roles, grants]
    target: create_empty_database
    databases: [panel]
    persistent: true
    recreatable: true
  - graph_id: datastore_docker_volumes
    host: vps14
    kind: empty_application_volumes
    data: [fresh AdGuard config, fresh Nextcloud config, fresh Forgejo config, fresh Stirling config]
    target: create_empty_volumes
    persistent: true
    recreatable: true
  - graph_id: datastore_wazuh
    host: vps14
    kind: fresh_monitoring_state
    data: [manager config, indexer config, dashboard config, new indexes]
    target: initialize_empty_stack
    persistent: true
    recreatable: true

persistent_application_data_out_of_scope:
  - graph_id: pd_ad_system_state
    host: vps13
    data: [old NTDS, old SYSVOL, old AD state]
    action: do_not_restore; create_new_domain
    status: out_of_scope
  - graph_id: pd_wireguard_keys
    host: vps14
    data: [old server key, old peer keys]
    action: generate_new_keys
    status: out_of_scope
  - graph_id: pd_nextcloud
    host: vps14
    data: [old files, old config, old database, old Redis state]
    action: no_migration; initialize_empty_application
    status: out_of_scope
  - graph_id: pd_forgejo
    host: vps14
    data: [old repositories, old attachments, old database]
    action: no_migration; initialize_empty_application
    status: out_of_scope
  - graph_id: legacy_wazuh_history
    host: vps14
    data: [old indexes, old events, old retention history]
    action: no_restore; start_empty_indexer
    status: out_of_scope
