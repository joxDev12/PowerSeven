schema_version: 1
source_graph: ../../graph/powerseven.graph.json
mode: declarative_model_only
hosts:
  vps12:
    graph_id: host_vps12
    source_name: VPS12
    hostname: soc-desktop
    os:
      family: Ubuntu
      edition: Desktop
      version_observed: "24.04.4"
      state: observed
    role: SOC desktop
    compute:
      cpu:
        value: 4
        state: observed
      ram_gib:
        value: 15
        state: observed
      disks:
        - device: root
          size_gib: 128
          state: observed
          free_gib_observed: 115
    interfaces:
      - graph_id: iface_vps12_wg
        name: wg-final
        address: 10.10.10.12/32
        network: wireguard
        state: observed
    services:
      - svc_wireguard_vps12
      - svc_ssh_vps12
      - svc_xrdp
      - svc_xfce
      - svc_sssd
      - mon_agent_vps12
    packages_or_roles:
      - wireguard
      - openssh-server
      - xrdp
      - xfce4
      - sssd
      - realmd
      - kerberos-member
      - wazuh-agent
    domain_membership:
      domain: LAB.TEST
      mechanism: SSSD/Kerberos
      state: observed
      secret_refs:
        - domain_join_password
    provisioning:
      order: 10
      bootstrap: ubuntu-autoinstall-cloud-init
      configure_with: ansible-linux
      prerequisites: [vps13_ad_dns, vps14_wireguard_wazuh]

  vps13:
    graph_id: host_vps13
    source_name: VPS13
    hostname: DC02
    os:
      family: Windows Server
      edition: Datacenter
      version_observed: "2022"
      state: observed
    role: Active Directory domain controller and DNS
    compute:
      cpu:
        value: 2
        state: observed
      ram_gib:
        value: 4
        state: observed
      disks:
        - device: "C:"
          size_gib: 126
          state: observed
          free_gib_observed: 112
    interfaces:
      - graph_id: iface_vps13_lab
        name: Lab-Final
        address: 10.10.10.13/32
        network: wireguard
        state: observed
    services:
      - svc_wireguard_vps13
      - svc_ssh_dc02
      - svc_rdp_dc02
      - svc_winrm_dc02
      - id_ad_ds
      - id_dns_dc02
      - id_kerberos
      - id_ldap
      - id_ldaps
      - id_global_catalog
      - cfg_windows_firewall
      - mon_agent_dc02
    packages_or_roles:
      - AD-Domain-Services
      - DNS
      - Active-Directory-Certificate-Services
      - OpenSSH-Server
      - WireGuard
      - Wazuh Agent
    domain:
      fqdn: LAB.TEST
      netbios: LAB
      role: forest-root-domain-controller
      state: observed
      secret_refs:
        - domain_safe_mode_password
        - domain_admin_password
    provisioning:
      order: 2
      bootstrap: windows-unattend-powershell
      configure_with: powershell-ansible-windows
      prerequisites: []

  vps14:
    graph_id: host_vps14
    source_name: VPS14
    hostname: soc-server
    os:
      family: Ubuntu
      edition: Server
      version_observed: "24.04.4"
      state: observed
    role: WireGuard hub and service platform
    compute:
      cpu:
        value: 4
        state: observed
      ram_gib:
        value: 15
        state: observed
      disks:
        - device: root
          size_gib: 128
          state: observed
          free_gib_observed: 96
    interfaces:
      - graph_id: iface_vps14_wg
        name: wg-final
        address: 10.10.10.14/24
        network: wireguard
        state: observed
    services:
      - svc_wireguard_hub
      - svc_ssh_vps14
      - svc_nginx
      - svc_docker
      - db_postgresql
      - db_mariadb
      - db_redis
      - mon_manager
      - mon_indexer
      - mon_dashboard
      - svc_wings
      - svc_pteroq
      - app_portal
      - app_scribble
    packages_or_roles:
      - wireguard
      - openssh-server
      - nginx
      - docker-engine
      - postgresql
      - mariadb-server
      - redis-server
      - wazuh-manager
      - wazuh-indexer
      - wazuh-dashboard
      - pterodactyl-panel
      - wings
      - azienda-portal
      - scribble
    provisioning:
      order: 5
      bootstrap: ubuntu-autoinstall-cloud-init
      configure_with: ansible-linux
      prerequisites: [vps13_ad_dns]

