schema_version: 2
source_graph: ../../graph/powerseven.graph.json
scope:
  source_current: azure_reference
  target_local: vmware_rebuild
bootstrap:
  temporary_resolver: 192.168.214.2
  dc02_forwarder_initial: 192.168.214.2
  adguard_address: 192.168.214.14
  dc02_forwarder_final: 192.168.214.14
  switch_condition: app_adguard_health_check_passed
address_planes:
  infrastructure_dns:
    transport: underlay
    cidr: 192.168.214.0/24
    vps12_resolver: 192.168.214.13
    vps14_resolver: 192.168.214.13
    dc02_forwarder: 192.168.214.14
  application_dns_records:
    transport: wireguard_overlay
    cidr: 10.10.10.0/24
    service_address: 10.10.10.14
zones:
  - name: lab.test
    kind: active_directory_integrated
    authoritative_service: id_dns_dc02
    records:
      - name: dc02
        type: A
        address: 192.168.214.13
        address_plane: underlay
      - name: cloud
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: git
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: login
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: panel
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: pdf
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: scribble
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: scribble-2
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: wazuh
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: wings
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
      - name: adguard
        type: A
        address: 10.10.10.14
        address_plane: wireguard_overlay
    state: observed
    target_state: create_fresh_zone
  - name: _msdcs.lab.test
    kind: active_directory_integrated
    authoritative_service: id_dns_dc02
    state: observed
    target_state: create_fresh_ad_integrated_zone
  - name: reverse-local
    kind: reverse_dns
    authoritative_service: id_dns_dc02
    state: observed
    target_state: create_only_records_needed_by_new_lab
resolver_chain:
  - client: vps12
    resolver_initial: 192.168.214.2
    resolver_final: 192.168.214.13
    purpose: domain_and_internal_dns
  - client: vps13
    resolver_initial: 192.168.214.2
    resolver_final: 127.0.0.1
    forwarder_initial: 192.168.214.2
    forwarder_final: 192.168.214.14
  - client: id_dns_dc02
    forwarder_initial: 192.168.214.2
    forwarder_final: 192.168.214.14
    state: target_bootstrap_then_final
  - client: vps14
    resolver_initial: 192.168.214.2
    resolver_final: 192.168.214.13
  - client: app_adguard
    upstream: internet
    state: new_lab_upstreams_to_be_declared
