#cloud-config
autoinstall:
  version: 1
  refresh-installer: false
  update: false
  shutdown: poweroff
  identity:
    hostname: soc-desktop
    username: powerseven-bootstrap
    password: REQUIRED_SECRET
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - REQUIRED_SECRET
  packages:
    - openssh-server
    - ca-certificates
    - curl
    - sudo
    - wireguard
  network:
    version: 2
    ethernets:
      <UNDERLAY_INTERFACE>:
        dhcp4: false
        addresses: [192.168.214.12/24]
        routes:
          - to: default
            via: 192.168.214.2
        nameservers:
          addresses: [192.168.214.2]
  late-commands:
    - curtin in-target --target=/target -- systemctl disable --now apt-daily-upgrade.timer
