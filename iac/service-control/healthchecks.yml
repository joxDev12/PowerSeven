schema_version: 2
scope: target_local_vmware

profiles:
  core:
    - id: wireguard
      type: systemd
      unit: wg-quick@wg0.service
      command: systemctl is-active --quiet wg-quick@wg0.service
    - id: ssh
      type: systemd
      unit: ssh.socket
      command: systemctl is-active --quiet ssh.socket
    - id: docker
      type: systemd
      unit: docker.service
      command: systemctl is-active --quiet docker.service
    - id: nginx
      type: systemd
      unit: nginx.service
      command: systemctl is-active --quiet nginx.service
    - id: dashboard
      type: http
      url: http://127.0.0.1:5000/health
      expected_status: 200
      command: curl --fail --silent --show-error http://127.0.0.1:5000/health
    - id: cockpit-socket
      type: systemd
      unit: cockpit.socket
      command: systemctl is-active --quiet cockpit.socket
    - id: adguard
      type: dns
      address: 10.10.10.14
      port: 53
      command: dig +short @10.10.10.14 example.com A

  forgejo:
    - id: container
      type: docker
      container: soc-forgejo-forgejo-1
      expected_health: healthy
      command: docker inspect --format '{{.State.Health.Status}}' soc-forgejo-forgejo-1
    - id: app
      type: http
      url: http://127.0.0.1:3001/
      expected_status: 200
      command: curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3001/
    - id: database
      type: systemd
      unit: postgresql@18-main.service
      command: pg_isready -h 10.10.10.14 -p 5432

  nextcloud:
    - id: database
      type: systemd
      unit: postgresql@18-main.service
      command: pg_isready -h 10.10.10.14 -p 5432
    - id: redis
      type: docker
      container: soc-cloud-redis-1
      command: docker exec soc-cloud-redis-1 redis-cli ping
    - id: app
      type: docker
      container: soc-cloud-app-1
      command: docker inspect --format '{{.State.Status}}' soc-cloud-app-1
    - id: cron
      type: docker
      container: soc-cloud-cron-1
      command: docker inspect --format '{{.State.Status}}' soc-cloud-cron-1

  stirling:
    - id: app
      type: docker
      container: soc-stirling-stirling-1
      command: docker inspect --format '{{.State.Health.Status}}' soc-stirling-stirling-1
    - id: http
      type: http
      url: http://127.0.0.1:8084/api/v1/info/status
      expected_status: 200
      command: curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8084/api/v1/info/status

  pterodactyl-panel:
    - id: mariadb
      type: systemd
      unit: mariadb.service
      command: systemctl is-active --quiet mariadb.service
    - id: redis
      type: systemd
      unit: redis-server.service
      command: systemctl is-active --quiet redis-server.service
    - id: php-fpm
      type: systemd
      unit: php8.3-fpm.service
      command: systemctl is-active --quiet php8.3-fpm.service
    - id: pteroq
      type: systemd
      unit: pteroq.service
      command: systemctl is-active --quiet pteroq.service
    - id: scheduler
      type: systemd
      unit: powerseven-pterodactyl-schedule.timer
      command: systemctl is-active --quiet powerseven-pterodactyl-schedule.timer
    - id: panel
      type: http
      url: https://panel.lab.test/
      expected_status: [200, 302]
      command: curl --fail --silent --show-error --insecure --max-time 5 --resolve panel.lab.test:443:127.0.0.1 https://panel.lab.test/

  pterodactyl-wings:
    - id: docker
      type: systemd
      unit: docker.service
      command: systemctl is-active --quiet docker.service
    - id: network
      type: docker-network
      network: pterodactyl_nw
      command: docker network inspect pterodactyl_nw
    - id: wings
      type: systemd
      unit: wings.service
      command: systemctl is-active --quiet wings.service
    - id: api
      type: http
      url: http://127.0.0.1:8080/
      expected_status: [200, 401, 404]
      command: curl --silent --show-error --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/
    - id: panel-reachability-for-fresh-start
      type: http
      url: https://panel.lab.test/
      expected_status: [200, 302]
      command: getent hosts panel.lab.test && curl --fail --silent --show-error --insecure --max-time 5 https://panel.lab.test/

  wazuh:
    - id: indexer
      type: systemd
      unit: wazuh-indexer.service
      command: systemctl is-active --quiet wazuh-indexer.service
    - id: indexer_https_local
      type: http
      url: https://127.0.0.1:9200/
      expected_status: [200, 401, 403]
      command: curl --silent --show-error --insecure --connect-timeout 3 --max-time 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:9200/
    - id: manager
      type: systemd
      unit: wazuh-manager.service
      command: systemctl is-active --quiet wazuh-manager.service
    - id: manager_api_local
      type: http
      url: https://127.0.0.1:55000/
      expected_status: [200, 401, 403]
      command: curl --silent --show-error --insecure --connect-timeout 3 --max-time 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:55000/
    - id: filebeat_service
      type: systemd
      unit: filebeat.service
      command: systemctl is-active --quiet filebeat.service
    - id: dashboard
      type: systemd
      unit: wazuh-dashboard.service
      command: systemctl is-active --quiet wazuh-dashboard.service
    - id: dashboard_https_local
      type: http
      url: https://127.0.0.1:8443/
      expected_status: [200, 302, 401, 403]
      command: curl --silent --show-error --insecure --connect-timeout 3 --max-time 5 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/

  scribble:
    - id: wings-control-plane
      type: systemd
      unit: wings.service
      command: systemctl is-active --quiet wings.service
    - id: container-8081
      type: docker
      container: 8fe0a128-6fb0-44ad-b6da-a7a83a1c44b5
      expected_state: running
      command: docker inspect --format '{{.State.Status}}' 8fe0a128-6fb0-44ad-b6da-a7a83a1c44b5
    - id: container-8082
      type: docker
      container: 548ab28c-0e73-4706-a894-959a2d1b76a1
      expected_state: running
      command: docker inspect --format '{{.State.Status}}' 548ab28c-0e73-4706-a894-959a2d1b76a1
    - id: http-8081
      type: http
      url: http://10.10.10.14:8081/
      expected_status: 200
      command: curl --fail --silent --show-error --max-time 5 http://10.10.10.14:8081/
    - id: http-8082
      type: http
      url: http://10.10.10.14:8082/
      expected_status: 200
      command: curl --fail --silent --show-error --max-time 5 http://10.10.10.14:8082/
