schema_version: 2
scope: target_local_vmware
source: measured_vps14_discovery_2026-09-26

boot:
  default_profile: CORE
  core_profile: CORE
  heavy_applications_must_not_autostart: true
  docker_restart_policy: controller_owned_for_managed_apps
  protected_units:
    - wg-quick@wg0.service
    - ssh.socket
    - docker.service
    - nginx.service
    - azienda-portal.service
    - powerseven-dashboard-health.service
    - powerseven-core-adguard.service
    - cockpit.socket
    - powerseven-core.target

architecture:
  model: dependency_aware_desired_state
  core_services:
    - WireGuard
    - SSH
    - Nginx
    - azienda-portal
    - AdGuard
    - Cockpit socket
    - Docker/containerd
  optional_shared_dependencies:
    - postgresql
    - mariadb
    - redis
    - php-fpm
  postgresql_core: false
  dashboard:
    service: azienda-portal.service
    authentication: Active Directory direct user bind
    postgres_dependency: none
  state:
    directory: /run/powerseven
    source_of_truth: systemd_and_docker_detection
    cache_files: [active-applications, required-dependencies, actual-dependencies, services, health, last-transition, last-failure]
  transition:
    lock: /run/lock/powerseven-controller.lock
    retry_policy: bounded_timeout_no_restart_loop

applications:
  FORGEJO:
    unit: powerseven-app-forgejo.service
    autostart: false
    requires: [docker.service, postgresql]
    container: soc-forgejo-forgejo-1
    healthchecks: [container-running, docker-health, http-local]
    ram_baseline_mib: 193.2
  NEXTCLOUD:
    unit: powerseven-app-nextcloud.service
    autostart: false
    requires: [docker.service, postgresql, nextcloud-redis]
  STIRLING:
    unit: powerseven-app-stirling.service
    autostart: false
    requires: [docker.service]
    healthchecks: [container-health, http-local]
    restart_policy: "no"
    image_version: "2.14.3"
    ram_baseline_mib: 919.4
    java_rss_baseline_mib: 870.4
    controlled_idle_baseline_mib: 768.3
    jvm_test_idle_mib: 780.7
    jvm_test_saving_mib: -12.4
  SCRIBBLE:
    unit: powerseven-app-scribble.service
    autostart: false
    requires: [docker.service]
    containers: [8fe0a128-6fb0-44ad-b6da-a7a83a1c44b5, 548ab28c-0e73-4706-a894-959a2d1b76a1]
    healthchecks: [container-8081, container-8082, http-8081, http-8082]
    restart_policy: "no"
    image_version: "v0.9.12"
    owner: pterodactyl_server_process
    ram_baseline_mib: 50.35
  PTERODACTYL:
    unit: powerseven-app-pterodactyl.service
    autostart: false
    requires: [docker.service, mariadb.service, redis-server.service, php8.3-fpm.service, wings.service]
  WAZUH:
    unit: powerseven-app-wazuh.service
    autostart: false
    requires: [wazuh-indexer.service, wazuh-manager.service, wazuh-dashboard.service, filebeat.service]

resource_baseline:
  forgejo_container_mib: 193.2
  postgresql_cluster_cgroup_mib: 47.7
  nextcloud_app_container_mib: 177.0
  nextcloud_cron_container_mib: 1.6
  nextcloud_redis_container_mib: 9.1
  docker_service_cgroup_mib: 201.3
  host_memory_available_gib: 10.0
  forgejo_postgresql_connections: 2
  measured_at: 2026-09-26

compatibility:
  legacy_profile_units: retained_for_unmigrated_apps_only
  forgejo_legacy_unit: removed
  postgresql_aggregator: postgresql.service
  postgresql_lifecycle_unit: postgresql@18-main.service
