schema_version: 2
scope: target_local_vmware
source: measured_vps14_discovery_2026-09-26

target:
  vcpu: 4
  memory_gib_initial: 5
  thin_disk_gib: 40
  status: recommended_initial_target_requires_local_validation
  experimental_memory_gib: 4
  fallback_memory_gib: 6

boot:
  default_profile: CORE
  core_profile: CORE
  heavy_applications_must_not_autostart: true
  docker_restart_policy: controller_owned_for_managed_apps
  protected_units:
    - wg-quick@wg0.service
    - ssh.socket
    - docker.service
    - nginx.service
    - azienda-portal.service
    - powerseven-dashboard-health.service
    - powerseven-core-adguard.service
    - cockpit.socket
    - powerseven-core.target

architecture:
  model: dependency_aware_desired_state
  core_services:
    - WireGuard
    - SSH
    - Nginx
    - azienda-portal
    - AdGuard
    - Cockpit socket
    - Docker/containerd
  optional_shared_dependencies:
    - postgresql
    - mariadb
    - redis
    - php-fpm
  postgresql_core: false
  dashboard:
    service: azienda-portal.service
    authentication: Active Directory direct user bind
    postgres_dependency: none
  state:
    directory: /run/powerseven
    source_of_truth: systemd_and_docker_detection
    cache_files: [active-applications, required-dependencies, actual-dependencies, services, health, last-transition, last-failure]
  transition:
    lock: /run/lock/powerseven-controller.lock
    retry_policy: bounded_timeout_no_restart_loop

applications:
  FORGEJO:
    unit: powerseven-app-forgejo.service
    autostart: false
    requires: [docker.service, postgresql]
    container: soc-forgejo-forgejo-1
    healthchecks: [container-running, docker-health, http-local]
    ram_baseline_mib: 193.2
  NEXTCLOUD:
    unit: powerseven-app-nextcloud.service
    autostart: false
    requires: [docker.service, postgresql, nextcloud-redis]
  STIRLING:
    unit: powerseven-app-stirling.service
    autostart: false
    requires: [docker.service]
    healthchecks: [container-health, http-local]
    restart_policy: "no"
    image_version: "2.14.3"
    ram_baseline_mib: 919.4
    java_rss_baseline_mib: 870.4
    controlled_idle_baseline_mib: 768.3
    jvm_test_idle_mib: 780.7
    jvm_test_saving_mib: -12.4
  SCRIBBLE:
    unit: powerseven-app-scribble.service
    autostart: false
    requires: [docker.service, wings.service]
    containers: [8fe0a128-6fb0-44ad-b6da-a7a83a1c44b5, 548ab28c-0e73-4706-a894-959a2d1b76a1]
    healthchecks: [container-8081, container-8082, http-8081, http-8082]
    control_plane: wings_local_api
    panel_bootstrap: required_for_wings_or_server_start
    restart_policy: "no"
    image_version: "v0.9.12"
    owner: pterodactyl_server_process
    ram_baseline_mib: 50.35
  PTERODACTYL_PANEL:
    unit: powerseven-app-pterodactyl-panel.service
    autostart: false
    requires: [mariadb.service, redis-server.service, php8.3-fpm.service, pteroq.service]
    core_requires: [nginx.service]
    scheduler: powerseven-pterodactyl-schedule.timer
    healthchecks: [mariadb, redis, php-fpm, pteroq, scheduler, panel-http]
    restart_policy: "no"
    panel_root: /var/www/pterodactyl
    panel_db: panel
    queue_backend: redis-server.service
    session_cache_backend: redis-server.service
    php_fpm_classification: exclusive_panel_consumer
  PTERODACTYL_WINGS:
    unit: powerseven-app-pterodactyl-wings.service
    autostart: false
    requires: [docker.service]
    core_requires: [wg-quick@wg0.service]
    healthchecks: [docker, network, wings-api]
    restart_policy: "no"
    network: pterodactyl_nw
    server_process_guard: ContainerType=server_process
    panel_dependency: optional_runtime_reachability
    fresh_start_requires: panel.lab.test_dns_https_and_http
  WAZUH:
    unit: powerseven-app-wazuh.service
    autostart: false
    requires: [wazuh-indexer.service, wazuh-manager.service, filebeat.service, wazuh-dashboard.service]
    start_order: [wazuh-indexer.service, wazuh-manager.service, filebeat.service, wazuh-dashboard.service]
    stop_order: [wazuh-dashboard.service, filebeat.service, wazuh-manager.service, wazuh-indexer.service]
    healthchecks: [indexer_https_local, manager_api_local, filebeat_service, dashboard_https_local]
    ports: [1514/tcp, 1515/tcp, 55000/tcp, 9200/tcp, 8443/tcp]
    native_units: [wazuh-indexer.service, wazuh-manager.service, filebeat.service, wazuh-dashboard.service]
    native_units_enabled_at_boot: false
    agent_count_baseline: 2
    startup_seconds_observed: [30, 40]
    manager_cgroup_mib_observed: [400, 450]
    indexer_cgroup_mib_observed: [950, 1050]
    dashboard_filebeat_cgroup_mib_observed: 180
    ram_tuned_stabilized_mib: [1536, 1638]
    host_used_with_wazuh_on_gib_observed: [2.6, 2.7]
    indexer_heap_mib: [512, 512]
    indexer_direct_memory_mib: 256
    tuning_applied: true
    tuning_source_of_truth: ../ansible/roles/wazuh_server/defaults/main.yml

resource_baseline:
  forgejo_container_mib: 193.2
  postgresql_cluster_cgroup_mib: 47.7
  nextcloud_app_container_mib: 177.0
  nextcloud_cron_container_mib: 1.6
  nextcloud_redis_container_mib: 9.1
  pterodactyl_mariadb_cgroup_mib: 145.6
  pterodactyl_redis_cgroup_mib: 8.6
  pterodactyl_php_fpm_cgroup_mib: 11.9
  pterodactyl_pteroq_cgroup_mib: 39.0
  pterodactyl_wings_cgroup_mib: 23.7
  pterodactyl_server_process_total_mib: 52.35
  docker_service_cgroup_mib: 201.3
  host_memory_available_gib: 10.0
  forgejo_postgresql_connections: 2
  measured_at: 2026-09-26

compatibility:
  legacy_profile_units: retained_for_unmigrated_apps_only
  forgejo_legacy_unit: removed
  postgresql_aggregator: postgresql.service
  postgresql_lifecycle_unit: postgresql@18-main.service
  pterodactyl_cron_replaced_by: powerseven-pterodactyl-schedule.timer
