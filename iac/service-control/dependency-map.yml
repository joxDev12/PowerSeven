schema_version: 2
scope: target_local_vmware

principles:
  - CORE is protected and never stopped by an application transition.
  - Applications are independent; there are no application Conflicts edges.
  - Required dependencies are recalculated as the union of active applications.
  - Runtime state is a reconstructible cache, never the source of truth.
  - Only the allowlisted PowerSeven controller may stop managed dependencies.

core_services:
  - wg-quick@wg0.service
  - ssh.socket
  - nginx.service
  - azienda-portal.service
  - powerseven-dashboard-health.service
  - powerseven-core-adguard.service
  - cockpit.socket
  - docker.service
  - powerseven-core.target

applications:
  FORGEJO:
    unit: powerseven-app-forgejo.service
    requires: [docker.service, postgresql]
    container: soc-forgejo-forgejo-1
    health: http://127.0.0.1:3001/
  NEXTCLOUD:
    unit: powerseven-app-nextcloud.service
    requires: [docker.service, postgresql, nextcloud-redis]
    containers: [soc-cloud-app-1, soc-cloud-cron-1, soc-cloud-redis-1]
  STIRLING:
    unit: powerseven-app-stirling.service
    requires: [docker.service]
    container: soc-stirling-stirling-1
    health: http://127.0.0.1:8084/api/v1/info/status
  SCRIBBLE:
    unit: powerseven-app-scribble.service
    requires: [docker.service, wings.service]
    containers: [8fe0a128-6fb0-44ad-b6da-a7a83a1c44b5, 548ab28c-0e73-4706-a894-959a2d1b76a1]
    health: [http://10.10.10.14:8081/, http://10.10.10.14:8082/]
    control_plane: wings_local_api
    power_endpoint: /api/servers/<allowlisted-uuid>/power
    panel_bootstrap: required_for_wings_or_server_start
  PTERODACTYL_PANEL:
    unit: powerseven-app-pterodactyl-panel.service
    requires: [mariadb.service, redis-server.service, php8.3-fpm.service, pteroq.service]
    core_requires: [nginx.service]
    health: https://panel.lab.test/
    scheduler: powerseven-pterodactyl-schedule.timer
  PTERODACTYL_WINGS:
    unit: powerseven-app-pterodactyl-wings.service
    requires: [docker.service]
    core_requires: [wg-quick@wg0.service]
    health: http://127.0.0.1:8080/
    network: pterodactyl_nw
    protects: ContainerType=server_process
    panel_reachability: required_for_fresh_start
  WAZUH:
    unit: powerseven-app-wazuh.service
    requires: [wazuh-indexer.service, wazuh-manager.service, filebeat.service, wazuh-dashboard.service]
    start_order: [wazuh-indexer.service, wazuh-manager.service, filebeat.service, wazuh-dashboard.service]
    stop_order: [wazuh-dashboard.service, filebeat.service, wazuh-manager.service, wazuh-indexer.service]
    ports: [1514/tcp, 1515/tcp, 55000/tcp, 9200/tcp, 8443/tcp]
    health: [indexer_https_local, manager_api_local, filebeat_service, dashboard_https_local]
    boot_policy: wrapper_and_native_units_disabled

shared_dependencies:
  docker.service:
    class: core
    consumers: [FORGEJO, NEXTCLOUD, STIRLING, SCRIBBLE, PTERODACTYL_WINGS]
    stop_policy: never
  postgresql:
    class: shared
    systemd_unit: postgresql@18-main.service
    consumers: [FORGEJO, NEXTCLOUD]
    stop_policy: stop_only_when_not_required
  nextcloud-redis:
    class: shared
    consumers: [NEXTCLOUD]
    stop_policy: owned_by_nextcloud_stack
  mariadb.service:
    class: shared
    consumers: [PTERODACTYL_PANEL]
    stop_policy: stop_only_when_not_required
  redis-server.service:
    class: shared
    consumers: [PTERODACTYL_PANEL]
    stop_policy: stop_only_when_not_required
  php8.3-fpm.service:
    class: shared
    consumers: [PTERODACTYL_PANEL]
    stop_policy: stop_only_when_not_required

controller:
  implementation: powerseven-controller.py
  lock: /run/lock/powerseven-controller.lock
  state_dir: /run/powerseven
  active_applications_source: systemd_and_docker_detection
  desired_state: union_of_application_requires
  managed_dependencies: [docker.service, postgresql, mariadb.service, redis-server.service, php8.3-fpm.service, pteroq.service, wings.service]
  protected_core: true
  arbitrary_units: false
  arbitrary_compose_projects: false

dependency_graph:
  cycles: forbidden
  postgresql_rule: "stop postgresql@18-main.service only when no active application requires it and no non-system PostgreSQL client remains"
  mariadb_rule: "stop mariadb.service only when no active application requires it and no external MariaDB client remains"
  redis_rule: "stop redis-server.service only when no active application requires it and no external Redis client remains"
  php_fpm_rule: "php8.3-fpm.service is panel-exclusive after runtime discovery"
  wings_rule: "never stop wings.service while a ContainerType=server_process container is running"
